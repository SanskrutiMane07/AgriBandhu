<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Alerts | AgriBandhu</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    font-family:'Poppins',sans-serif;
    background:#f8f9fa;
}

.navbar{
    background: linear-gradient(90deg,#71ae7f,#81c784);
}

.navbar-brand{
    font-weight:700;
    font-size:1.8rem;
 color:#fff;
}

.navbar-nav .nav-link{
    color:#fff;
    font-weight:500;
    transition:color 0.3s;
}

.navbar-nav .nav-link:hover{
    color:#ffd700;
}

.page-header{
    background:#e8f5e9;
    padding:60px 20px;
    text-align:center;
}

.weather-card{
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    padding:25px;
    margin-bottom:25px;
    transition:0.3s;
    text-align:center;
}

.weather-card:hover{
    transform:translateY(-5px);
}

.weather-icon{
    font-size:40px;
}

footer{
    background:#71ae7f;
    color:white;
    padding:20px;
    text-align:center;
    margin-top:50px;
}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
<div class="container">
<a class="navbar-brand" href="/">🌾 AgriBandhu</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="navbarNav">
<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="/">Home</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/#features">Features</a>
</li>

<li class="nav-item">
<a class="nav-link active" href="#">Weather Alerts</a>
</li>

</ul>
</div>
</div>
</nav>

<section class="page-header">
<h1 class="fw-bold">Weather Updates</h1>
<p>Stay informed about weather conditions affecting your crops.</p>
</section>

<div class="container mt-5">

<div class="row">

<div class="col-md-4">
<div class="weather-card">
<div class="weather-icon">🌤</div>
<h5 class="mt-3">Temperature</h5>
<p id="temp">Loading...</p>
</div>
</div>

<div class="col-md-4">
<div class="weather-card">
<div class="weather-icon">🌧</div>
<h5 class="mt-3">Rainfall</h5>
<p id="rain">Loading...</p>
</div>
</div>

<div class="col-md-4">
<div class="weather-card">
<div class="weather-icon">💨</div>
<h5 class="mt-3">Wind Speed</h5>
<p id="wind">Loading...</p>
</div>
</div>

</div>

<div class="weather-card mt-4">
<h5>Farming Advice</h5>
<p id="advice">Loading...</p>
</div>

</div>

<footer>
© 2026 AgriBandhu | Smart Farming Companion
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

/* ✅ FETCH WEATHER DATA */
fetch('/get_weather?city=Pune')
.then(res => res.json())
.then(data => {

    if(data.error){
        document.getElementById("temp").innerText = "Error";
        return;
    }

    // Temperature
    document.getElementById("temp").innerText = data.temperature + "°C";

    // Humidity → Rain logic
    if(data.humidity > 70){
        document.getElementById("rain").innerText = "High chance of rain 🌧";
    } else {
        document.getElementById("rain").innerText = "No Rain Expected ☀";
    }

    // Fake wind (API me nahi hai current route me)
    document.getElementById("wind").innerText = "10 km/h";

    // Farming Advice
    if(data.temperature > 30){
        document.getElementById("advice").innerText = "High temperature. Irrigation recommended.";
    } else if(data.humidity > 70){
        document.getElementById("advice").innerText = "High humidity. Watch for fungal diseases.";
    } else {
        document.getElementById("advice").innerText = "Weather is suitable for farming activities.";
    }

});

</script>

</body>
</html>
