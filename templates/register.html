<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AgriBandhu</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        
    body{
    font-family: 'Poppins', sans-serif;

    background:
        linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)),
        url("https://images.unsplash.com/photo-1500382017468-9049fed747ef");

    background-size: cover;
    background-position: center;
}

        .navbar {
            background: linear-gradient(90deg, #71ae7f, #81c784);
        }
        .navbar-nav .nav-link{color:white; transition:color 0.3s;}
.navbar-nav .nav-link:hover{
    color:#ffd700;
}
        .navbar-brand {
            font-weight: 700;
            font-size: 1.8rem;
            color: #fff;
        }

        .register-card {
            max-width: 450px;
            margin: 60px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            background: #fff;
        }

        .register-card h2 {
            margin-bottom: 25px;
            font-weight: 700;
            text-align: center;
        }

        .btn-custom {
            padding: 12px 28px;
            font-size: 18px;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-success {
            background-color: #58b56e;
            border-color: #71ae7f;
        }

        .btn-success:hover {
            background-color: #5f996a;
            border-color: #5f996a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 576px) {
            .register-card {
                margin: 40px 15px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">🌾 AgriBandhu</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavRegister">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavRegister">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Register Form -->
    <div class="register-card">
        <h2>Create Account</h2>
        {% if error %}
        <div class="alert alert-danger text-center">
            {{ error }}
        </div>
        {% endif %}
        <form method="POST" action="/register">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="fullname" class="form-control" placeholder="Enter your full name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Create a password" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Confirm your password"
                    required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-success btn-custom">Register</button>
            </div>

            <p class="mt-3 text-center">
                Already have an account? <a href="/login">Login</a>
            </p>
        </form>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2026 AgriBandhu. All rights reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
