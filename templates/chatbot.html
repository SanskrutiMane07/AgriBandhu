<div class="main-content">

<!-- ✅ Chatbot -->
<div class="chat-container">

<div class="chat-header">
🌾 AgriBandhu AI (Live Chat Mode)
</div>

<div class="quick-box">
<button class="btn btn-success btn-sm" onclick="quickAsk('best crop for my land')">🌾 Crop</button>
<button class="btn btn-success btn-sm" onclick="quickAsk('fertilizer recommendation')">🧪 Fertilizer</button>
<button class="btn btn-success btn-sm" onclick="quickAsk('weather forecast')">🌦 Weather</button>
<button class="btn btn-success btn-sm" onclick="quickAsk('government schemes')">🏛 Schemes</button>
</div>

<div id="chatBox" class="chat-box">
<div class="msg-row bot">
<div class="bubble">
👋 Hello Farmer!
I am AgriBandhu AI Assistant 🌾
Ask me about crops, fertilizer, weather, schemes or profit prediction.
<div class="time">now</div>
</div>
</div>
</div>

<div class="chat-input">
<input type="text" id="userInput" placeholder="Type message...">
<button onclick="sendMessage()">Send</button>
</div>

</div>
</div>

<!-- ✅ Footer -->
<footer>
© 2026 AgriBandhu | Smart Farming Companion
</footer>

<script>
function timeNow(){
    let t = new Date();
    return t.getHours() + ":" + t.getMinutes();
}

function addMessage(text, type){
    let chatBox = document.getElementById("chatBox");

    let div = document.createElement("div");
    div.className = "msg-row " + type;

    div.innerHTML = `
        <div class="bubble">
            ${text}
            <div class="time">${timeNow()}</div>
        </div>
    `;

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function sendMessage() {
    let input = document.getElementById("userInput");
    let text = input.value.trim();

    if (text === "") return;

    addMessage(text, "user");
    input.value = "";

    fetch("/chat", {  // Ensure this is '/chat' to match @app.route('/chat')
        method: "POST",
        headers: {
            "Content-Type": "application/json" // Must be exactly this
        },
        body: JSON.stringify({ message: text })
    })
    .then(res => res.json())
    .then(data => {
        setTimeout(() => {
            addMessage(data.reply, "bot");
        }, 300);
    })
    .catch(err => {
        console.error("Error:", err);
        addMessage("⚠️ Connection error. Ensure Flask is running.", "bot");
    });
}
function quickAsk(text){
    document.getElementById("userInput").value = text;
    sendMessage();
}
</script>

</body>
